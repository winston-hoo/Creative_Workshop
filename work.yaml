# 作品配置模板
#
# ⚠️ 这是模板，不是任何一本真实作品的配置。
#    每本作品应有自己的一份，放在 `workspaces/{作品名}/work.yaml`。
#
#    原因：原来只有 workshop 根目录这一份，接入第二本作品后就失效了——
#    主角和核心动机会被套到别的作品上，而这两项直接决定结构原语 P21 的度量对象。
#
# 本文件保留的作用有两个：
#   1. 作为新作品配置的起手模板
#   2. 自检用的默认配置（tests/test_annotate.py 依赖这里的 style_checks）

work: 示例作品

protagonist: 示例主角

# 主角核心动机。**决定 P21「主角核心动机呈现强度」在度量什么。**
# 留空的话模型会自己猜一个动机来打分，那一列数据就不可信。
core_motive: ""

# 风格硬约束（机器可校验，全部由脚本检测，不花模型成本）
style_checks:
  # 人称检测：按段落多数投票判定，并指出偏离段落
  - id: STYLE-001
    desc: 第一人称叙事，不得切换人称
    type: perspective
    expected: 第一人称
    first_person_markers: [我, 我们, 咱, 咱们]
    third_person_markers: [他, 她, 他们, 她们, 它, 它们]

  # 禁用字符：重叠写法会被去重，一个「——」只计 1 处
  - id: STYLE-002
    desc: 不使用破折号
    type: forbidden_chars
    chars: ["——", "—", "–", "──"]

  # 禁用句式：注意逗号后可能重复主语（「不是X，我是Y」），所以中间留 0 到 4 个字符
  - id: STYLE-003
    desc: 不使用「不是X，是Y」句式
    type: forbidden_pattern
    pattern: "不是[^，。！？；]{1,20}[，,][^，。！？；]{0,4}是"

ingest:
  # 这本书特有的章节标题写法（内置模板覆盖不到的那些）。
  # 加之前先看预览里的「格式变体探针」，它会列出像章节标题但没命中任何模板的行。
  chapter_patterns: []

  # 分段重启的标记词：标题行或紧邻上一行出现这些词时，
  # 章号回落到小数字会被判为新分段（如番外篇），而不是重号。
  section_markers: [番外, 外传, 前传, 序章, 楔子, 尾声, 第二部, 第三部, 第四部]
